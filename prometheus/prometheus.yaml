global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'postgresql-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'postgresql-backend:8181' ]

  - job_name: 'node_exporter'
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'node_exporter:9100' ]