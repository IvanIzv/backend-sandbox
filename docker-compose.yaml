networks:
  backend_sandbox_network:
    driver: bridge

services:

  postgresql:
    container_name: postgresql
    image: postgres
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgresql_user
      POSTGRES_PASSWORD: postgresql_password
      POSTGRES_DB: postgresql_database
      POSTGRES_SCHEMA: backend_schema
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgresql/data:/var/lib/postgresql/data
      - ./initdb/postgresql:/docker-entrypoint-initdb.d
    networks:
      - backend_sandbox_network

  postgresql-backend:
    container_name: postgresql-backend
    image: bellsoft/liberica-openjdk-alpine
    restart: unless-stopped
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgresql:5432/postgresql_database?currentSchema=backend_schema
      DATASOURCE_USERNAME: postgresql_user
      DATASOURCE_PASSWORD: postgresql_password
    volumes:
      - ./postgresql-backend/target:/app
    working_dir: /app
    command: java -jar postgresql-backend-1.0.0-SNAPSHOT.jar
    ports:
      - 8181:8181
    networks:
      - backend_sandbox_network
    depends_on:
      - postgresql

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    restart: unless-stopped
    volumes:
      - ./data/prometheus:/prometheus
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - '9090:9090'
    networks:
      - backend_sandbox_network
    depends_on:
      - postgresql-backend

  grafana:
    container_name: grafana
    image: grafana/grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/ds_prometheus.yaml:/etc/grafana/provisioning/datasources/ds_prometheus.yaml
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - backend_sandbox_network
    depends_on:
      - prometheus